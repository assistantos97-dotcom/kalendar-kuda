<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planning Board · OT Hub</title>
<link rel="stylesheet" href="hub.css">
<style>
body{-webkit-user-select:none;user-select:none}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.month{display:flex;align-items:center;gap:8px}
.month h2{margin:0;font-size:20px;font-weight:700;min-width:180px;text-align:center}
button.ico{width:40px;padding:0;font-size:18px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:6px 14px;min-width:120px}
.stat small{display:block;color:var(--mute);font-size:12px;font-weight:600}
.stat b{font-size:20px;font-variant-numeric:tabular-nums}
.pal{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.pal .lbl{font-size:13px;font-weight:600;color:var(--mute)}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:34px;padding:0 10px;border-radius:6px;background:var(--ot);color:var(--otInk);font-weight:700;font-size:15px;cursor:grab;touch-action:none;box-shadow:inset 0 -2px 0 #00000022}
.chip:active{cursor:grabbing}
.trash{margin-left:auto;display:flex;align-items:center;gap:6px;border:2px dashed var(--line);border-radius:8px;padding:6px 14px;color:var(--mute);font-weight:600;font-size:13px}
.trash.hot{border-color:var(--bad);color:var(--bad);background:var(--ph)}
.wrap{overflow:auto;border-radius:8px;border:1px solid var(--line);max-height:72vh}
table{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center}
thead th{position:sticky;top:0;background:var(--card);z-index:3}
thead tr.hl th{top:57px}
.nm{position:sticky;left:0;z-index:2;background:var(--card);text-align:left;min-width:150px;padding:0 8px;font-weight:600;white-space:nowrap}
thead .nm{z-index:4}
.day{width:33px;min-width:33px;height:56px;line-height:1.1}
.day .d{font-size:15px;font-weight:700;display:block}
.day .w{font-size:11px;color:var(--mute);font-weight:600}
.wkend{background:var(--we)!important}
.hol{background:var(--ph)!important}
.day.hol .d,.day.hol .w{color:var(--phInk)}
tr.hl th{height:92px;background:var(--card);vertical-align:middle}
.hp{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);border-radius:4px;background:var(--phInk);color:var(--card);font-size:10px;font-weight:700;line-height:1.1;padding:6px 3px;cursor:help;max-height:86px;overflow:hidden;white-space:nowrap}
td.cell{width:33px;height:44px;position:relative;background:var(--card)}
td.cell.tgt{outline:3px solid var(--pri);outline-offset:-3px;background:var(--priSoft)!important}
td.cell.paste{cursor:copy}
td.cell .chip{min-width:27px;height:30px;padding:0 2px;font-size:13px;border-radius:5px}
td.tot,th.tot{position:sticky;right:0;background:var(--soft);min-width:60px;font-weight:700;z-index:2}
thead th.tot{z-index:4}
td.tot small{display:block;font-size:11px;color:var(--mute);font-weight:500}
tfoot td{background:var(--soft);font-weight:700;font-size:12px;height:40px}
tfoot td small{display:block;font-size:9px;color:var(--mute);font-weight:500}
tfoot .nm{background:var(--soft)}
.nm .pn{outline:none;border-radius:4px;padding:2px 4px;cursor:text;-webkit-user-select:text;user-select:text}
.nm .pn:focus{background:var(--priSoft)}
.nm .x{border:0;background:none;min-height:0;padding:0 4px;color:var(--mute);font-size:16px;float:right}
.ghost{position:fixed;pointer-events:none;z-index:99;transform:translate(-50%,-50%) scale(1.12);box-shadow:0 10px 24px #0005}
.pop{position:fixed;z-index:60;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px #0f172a40;padding:10px;display:none;gap:8px;align-items:center}
.pop.on{display:flex}
.pop span{font-weight:700;font-size:18px;min-width:44px;text-align:center}
.pop button{min-height:36px;padding:0 10px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--mute);font-weight:500;margin-top:10px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px;border:1px solid var(--line)}
.hlist{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.hlist li{display:flex;gap:10px;align-items:center;font-size:14px;flex-wrap:wrap}
.hlist .dt{font-weight:700;color:var(--phInk);min-width:110px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--priSoft);color:var(--warn)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--bar);color:#fff;padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:80}
.toast.on{opacity:1}
textarea{-webkit-user-select:text;user-select:text}
.mblock{display:grid;gap:6px}
#gview{min-height:36px;padding:4px 10px;font-weight:600;font-size:14px;background:var(--card)}
.gform{display:flex;gap:6px;align-items:center}.gform[hidden]{display:none}
.gform input{min-height:36px;width:220px;font-size:14px}.gform button{min-height:36px}
tr.wsr td,tr.wsr th{height:22px}
tr.wsr td{border-bottom:1px dashed var(--line);cursor:pointer}
td.wsc{background:var(--card)}
.st{display:inline-block;min-width:18px;padding:0 3px;border-radius:4px;font-size:10px;font-weight:700;line-height:16px}
.stW{background:#c9f1cf;color:#13532a}.stO{background:#fbd0d6;color:#8a1c2a}.stR{background:#fbecb0;color:#6b5200}
:root[data-theme=dark] .stW{background:#1d4a2b;color:#a6efb9}:root[data-theme=dark] .stO{background:#56202a;color:#ffb3bd}:root[data-theme=dark] .stR{background:#4f4111;color:#ffe48a}
tr.otr td.cell{height:40px}
.pnew,.pedit{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pnew .lbl{font-size:13px;font-weight:600;color:var(--mute);margin-right:2px}
.pk{min-width:40px;height:32px;cursor:pointer;border:0;font-size:14px}
tr.grp .x.gdel{float:none;font-size:14px;margin-left:2px;vertical-align:middle}
.dept{font-size:13px;color:var(--mute)}.dept b{color:var(--ink)}
.hub-seg2{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.hub-seg2 button{min-height:34px;border:0;border-radius:0;background:var(--card);color:var(--ink);font-size:13px;padding:0 12px}
.hub-seg2 button+button{border-left:1px solid var(--line)}
.hub-seg2 button.on{background:var(--pri);color:var(--priInk)}
.sep{width:1px;height:26px;background:var(--line);margin:0 4px}
tr.grp th,tr.grp td{background:var(--priSoft);height:30px;border-bottom:1px solid var(--line)}
tr.grp .nm{background:var(--priSoft);font-weight:700;color:var(--pri)}
.gname{font-size:13px}
.gcnt{font-size:11px;font-weight:700;background:var(--card);color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:0 7px;margin-left:2px}
.gadd{min-height:0;height:22px;width:22px;padding:0;border-radius:5px;font-size:15px;line-height:1;margin-left:6px;vertical-align:middle}
tr.gsum th,tr.gsum td{background:var(--soft);font-size:11px;font-weight:600;color:var(--mute);height:26px;border-bottom:2px solid var(--line)}
tr.gsum .nm{font-size:12px}
tr.gsum td.ov{background:#f59e0b33!important;color:var(--warn);font-weight:700;box-shadow:inset 0 0 0 2px #f59e0b}
.ovc{color:var(--warn)!important;font-weight:700!important}
.lov{background:#f59e0b55!important;border-color:#f59e0b!important}
</style>
</head>
<body data-page="board">
<header id="hub"></header><script src="hub.js"></script>
<main>
  <section class="card">
    <div class="bar">
      <div class="mblock"><div class="month"><button class="alt ico" id="prev" aria-label="Previous month">‹</button><h2 id="mTitle"></h2><button class="alt ico" id="next" aria-label="Next month">›</button></div><div class="dept"><span data-t="dept"></span> <b>ME</b> · Manufacturing Engineering</div></div>
      <div class="stats">
        <div class="stat"><small data-t="sHrs"></small><b id="sHrs">0</b></div>
        <div class="stat"><small data-t="sCnt"></small><b id="sCnt">0</b></div>
        <div class="stat"><small data-t="sPpl"></small><b id="sPpl">0</b></div>
      </div>
    </div>
    <div class="pal">
      <span class="lbl" data-t="grpL"></span><select id="gview" aria-label="Group"></select><button class="alt" id="gNew" type="button" data-t="gNew"></button><form id="gForm" class="gform" hidden><input id="gName" maxlength="40" data-tp="gPh" aria-label="Group name"><button type="submit" data-t="gAdd"></button><button type="button" class="alt" id="gCancel" data-t="cancel"></button></form><span class="sep"></span><span class="lbl" data-t="drag"></span>
      <span class="chip" data-new="2">2h</span><span class="chip" data-new="3">3h</span><span class="chip" data-new="4">4h</span><span class="chip" data-new="8">8h</span><span class="chip" data-new="11">11h</span>
            <button class="alt" id="sample" data-t="sample"></button>
      <button class="warn" id="clear" data-t="clear"></button>
      <div class="trash" id="trash" data-t="trash"></div>
    </div>
  </section>

  <section class="card">
    <div class="wrap" id="wrap"><table id="grid"></table></div>
    <div class="legend"><span><i style="background:var(--ot)"></i><span data-t="lgOt"></span></span><span><i style="background:var(--we)"></i><span data-t="lgWe"></span></span><span><i style="background:var(--ph)"></i><span data-t="lgPh"></span></span><span><span class="st stW">W</span> <span class="st stO">O</span> <span class="st stR">R</span> <span data-t="lgWs"></span></span><span><i class="lov"></i><span data-t="lgOv"></span></span><span data-t="lgTip"></span></div>
  </section>

  <section class="card">
    <h2 style="margin:0" data-t="hTitle"></h2>
    <ul class="hlist" id="hlist"></ul>
    <details style="margin-top:14px"><summary data-t="hEdit"></summary>
      <textarea id="hol"></textarea>
      <p class="hint" data-t="hHint"></p>
      <button id="holSave" style="margin-top:8px" data-t="hSave"></button>
    </details>
  </section>
</main>

<div class="pop" id="pop" role="dialog" aria-label="OT block">
  <div class="pnew" id="pNew"><span class="lbl" data-t="pick"></span><button type="button" class="chip pk" data-h="1">1h</button><button type="button" class="chip pk" data-h="2">2h</button><button type="button" class="chip pk" data-h="3">3h</button><button type="button" class="chip pk" data-h="4">4h</button><button type="button" class="chip pk" data-h="5">5h</button><button type="button" class="chip pk" data-h="8">8h</button><button type="button" class="chip pk" data-h="11">11h</button><button class="alt" type="button" data-pclose aria-label="Close">✕</button></div>
  <div class="pedit" id="pEdit">
  <button class="alt" id="pMinus" aria-label="Less hours">−</button><span id="pVal">3</span><button class="alt" id="pPlus" aria-label="More hours">+</button>
  <button class="alt" id="pCopy" data-t="copy"></button><button class="warn" id="pDel" data-t="del"></button><button class="alt" id="pClose" aria-label="Close">✕</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const DEF_HOL = `2026-12-11 Sultan of Selangor's Birthday
2026-12-25 Christmas Day
2027-01-01 New Year's Day
2027-02-01 Federal Territory Day
2027-02-06 Chinese New Year
2027-02-07 Chinese New Year (2nd day)`;
const TX = {
 en: {sHrs:"Total OT hours", sCnt:"OT shifts", sPpl:"Staff with OT", drag:"Drag a new OT block:", add:"+ Add staff", sample:"Load sample", clear:"Clear month", clearQ:"Tap again to clear", trash:"Drop here to delete",
  lgOt:"OT block (hours)", lgWe:"Saturday / Sunday", lgPh:"Public holiday", dept:"Department:", grpL:"Group:", gNew:"+ New group", gAdd:"Create", cancel:"Cancel", gPh:"New group name, e.g. ME Process", gMade:n=>`Group "${n}" created. Use + on the group to add staff.`, gDel:"Delete group", pick:"OT hours:", wsName:{W:"Working day",O:"Off day",R:"Rest day"}, lgWs:"Work / Off / Rest day (tap to change)", all:"All", gtot:"Group total", addTo:"Add staff to", lgOv:"Overlap: 2+ staff in the same group on the same day", ovTip:n=>`${n} staff from this group on OT this day`, ovN:n=>`${n} overlap day${n>1?"s":""}`, lgTip:"Tap an empty cell to add OT. Tap a block to change hours, copy or delete. Drop on another block to swap. Daily total row: hours / people (p).",
  hTitle:"Public holidays this month", hEdit:"Edit holiday list", hHint:"One per line: YYYY-MM-DD Name. Shared with the Horse Calendar.", hSave:"Save holidays", copy:"Copy", del:"Delete",
  staff:"Staff", hol:"Holiday", total:"Total", dtot:"Daily total", day:"day", days:"days", noHol:"No public holidays in this month.", sun:"Falls on Sunday: check replacement holiday", sat:"Falls on Saturday",
  tDel:"OT block deleted", tCopy:v=>`Copied ${v}h. Tap empty cells to paste. Press Esc or tap outside the board to stop.`, tRm:n=>`${n} removed`, rmQ:"Remove?", tSample:"Sample plan loaded (December 2026)", tClr:"Month cleared", tHol:"Holidays saved", person:"Person",
  WD:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], MN:["January","February","March","April","May","June","July","August","September","October","November","December"]},
 ms: {sHrs:"Jumlah jam OT", sCnt:"Syif OT", sPpl:"Pekerja ada OT", drag:"Heret blok OT baru:", add:"+ Tambah pekerja", sample:"Isi contoh", clear:"Kosongkan bulan", clearQ:"Tekan lagi untuk kosongkan", trash:"Lepas di sini untuk padam",
  lgOt:"Blok OT (jam)", lgWe:"Sabtu / Ahad", lgPh:"Cuti umum", dept:"Jabatan:", grpL:"Grup:", gNew:"+ Grup baru", gAdd:"Cipta", cancel:"Batal", gPh:"Nama grup baru, cth ME Process", gMade:n=>`Grup "${n}" dicipta. Guna + pada grup untuk tambah pekerja.`, gDel:"Padam grup", pick:"Jam OT:", wsName:{W:"Hari bekerja",O:"Hari cuti (OFF)",R:"Hari rehat (REST)"}, lgWs:"Kerja / Off / Rehat (ketik untuk ubah)", all:"Semua", gtot:"Jumlah grup", addTo:"Tambah pekerja ke", lgOv:"Bertindih: 2+ pekerja grup sama pada hari sama", ovTip:n=>`${n} pekerja grup ini OT hari ini`, ovN:n=>`${n} hari bertindih`, lgTip:"Ketik petak kosong untuk tambah OT. Ketik blok untuk ubah jam, salin atau padam. Lepas atas blok lain untuk tukar. Baris jumlah harian: jam / orang (p).",
  hTitle:"Cuti umum bulan ini", hEdit:"Ubah senarai cuti", hHint:"Satu baris setiap cuti: YYYY-MM-DD Nama. Dikongsi dengan Kalendar Kuda.", hSave:"Simpan cuti", copy:"Salin", del:"Padam",
  staff:"Pekerja", hol:"Cuti", total:"Jumlah", dtot:"Jumlah harian", day:"hari", days:"hari", noHol:"Tiada cuti umum bulan ini.", sun:"Jatuh hari Ahad: semak cuti ganti", sat:"Jatuh hari Sabtu",
  tDel:"Blok OT dipadam", tCopy:v=>`${v}j disalin. Ketik petak kosong untuk tampal. Tekan Esc atau ketik luar papan untuk berhenti.`, tRm:n=>`${n} dibuang`, rmQ:"Buang?", tSample:"Contoh dimuatkan (Disember 2026)", tClr:"Bulan dikosongkan", tHol:"Cuti disimpan", person:"Person",
  WD:["Ahd","Isn","Sel","Rab","Kha","Jum","Sab"], MN:["Januari","Februari","Mac","April","Mei","Jun","Julai","Ogos","September","Oktober","November","Disember"]}
};
let X = TX[(window.HUB && HUB.lang) || "en"] || TX.en;
function applyT() { X = TX[(window.HUB && HUB.lang) || "en"] || TX.en; document.querySelectorAll("[data-t]").forEach(e => e.textContent = X[e.dataset.t]); document.querySelectorAll("[data-tp]").forEach(e => e.placeholder = X[e.dataset.tp]); }
document.addEventListener("hub:lang", () => { applyT(); render(); });
const pad = n => String(n).padStart(2, "0");
const iso = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;

// ---------- state ----------
const KEY = "otb:v3";
let S = null;
function sample() {
  const groups = [{id: "eq", name: "ME Equipment"}, {id: "tc", name: "ME TC"}];
  const people = ["Person A","Person B","Person C","Person D","Person E","Person F"].map((n, i) => ({id: "p" + (i + 1), name: n, g: i < 3 ? "eq" : "tc"}));
  const ot = {};
  // Real pattern: Mon-Fri work, Sat OFF, Sun REST; each person works 2 Saturdays (OFF day) x 8h.
  // December 2026 Saturdays: 5, 12, 19, 26. 3 people x 2 Saturdays = 6 slots on 4 Saturdays.
  const sat = {p1: [5, 19], p2: [12, 26], p3: [5, 26], p4: [5, 19], p5: [12, 26], p6: [12, 19]};
  for (const [p, ds] of Object.entries(sat)) for (const d of ds) ot[`${p}|2026-12-${pad(d)}`] = 8;
  return {y: 2026, m: 11, dept: "ME", groups, people, ot, ws: {}, view: "all"};
}
function load() { try { S = JSON.parse(localStorage.getItem(KEY)); } catch (e) {} if (!S || !S.people || !S.groups) S = sample(); if (!S.ws) S.ws = {}; }
const WS_NEXT = {W: "O", O: "R", R: "W"};
function wsOf(P, D) { return S.ws[`${P.id}|${D.k}`] || (D.w === 0 ? "R" : D.w === 6 ? "O" : "W"); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function holText() { try { return localStorage.getItem("kk-hol") || DEF_HOL; } catch (e) { return DEF_HOL; } }
function holidays() {
  const h = {};
  for (const l of holText().split(/\r?\n/)) { const m = l.match(/(\d{4})-(\d{1,2})-(\d{1,2})\s*(.*)/); if (m) h[iso(+m[1], +m[2] - 1, +m[3])] = m[4].trim() || "Public holiday"; }
  return h;
}

// ---------- render ----------
function render() {
  const {y, m} = S, nd = new Date(y, m + 1, 0).getDate(), H = holidays();
  $("mTitle").textContent = `${X.MN[m]} ${y}`;
  const days = [];
  for (let d = 1; d <= nd; d++) { const k = iso(y, m, d), w = new Date(y, m, d).getDay(); days.push({d, k, w, hol: H[k], wk: w === 0 || w === 6}); }
  const cls = D => D.hol ? "hol" : D.wk ? "wkend" : "";
  let h = `<thead><tr><th class="nm">${X.staff}</th>`;
  for (const D of days) h += `<th class="day ${cls(D)}"${D.hol ? ` title="${D.hol}"` : ""}><span class="d">${D.d}</span><span class="w">${X.WD[D.w]}</span></th>`;
  h += `<th class="tot">${X.total}</th></tr><tr class="hl"><th class="nm" style="font-size:12px;color:var(--mute)">${X.hol}</th>`;
  for (const D of days) h += `<th class="${cls(D)}">${D.hol ? `<span class="hp" title="${D.hol} (${X.WD[D.w]})">${short(D.hol)}</span>` : ""}</th>`;
  h += `<th class="tot"></th></tr></thead><tbody>`;
  const dayTot = days.map(() => ({h: 0, n: 0}));
  let gH = 0, gN = 0, ppl = 0, shown = 0;
  const groups = S.groups.filter(G => S.view === "all" || S.view === G.id);
  for (const G of groups) {
    const mem = S.people.filter(P => P.g === G.id);
    const gt = days.map(() => ({h: 0, n: 0}));
    h += `<tr class="grp"><th class="nm"><span class="gname">${esc(G.name)}</span> <span class="gcnt">${mem.length}</span><button class="gadd" data-add="${G.id}" aria-label="${X.addTo} ${esc(G.name)}" title="${X.addTo} ${esc(G.name)}">+</button><button class="x gdel" data-gdel="${G.id}" aria-label="${X.gDel} ${esc(G.name)}" title="${X.gDel}">×</button></th><td class="grow" colspan="${days.length + 1}"></td></tr>`;
    for (const P of mem) {
      let pH = 0, pN = 0; shown++;
      h += `<tr class="wsr"><th class="nm" rowspan="2"><span class="pn" contenteditable="true" spellcheck="false" data-p="${P.id}">${esc(P.name)}</span><button class="x" data-del="${P.id}" aria-label="Remove ${esc(P.name)}">×</button></th>`;
      days.forEach(D => { const w = wsOf(P, D); h += `<td class="wsc ${cls(D)}" data-ws="${P.id}|${D.k}" title="${X.wsName[w]}"><span class="st st${w}">${w}</span></td>`; });
      let rowOt = "";
      days.forEach((D, i) => {
        const v = S.ot[`${P.id}|${D.k}`];
        if (v) { pH += v; pN++; dayTot[i].h += v; dayTot[i].n++; gt[i].h += v; gt[i].n++; }
        rowOt += `<td class="cell ${cls(D)}" data-p="${P.id}" data-k="${D.k}">${v ? `<span class="chip" data-p="${P.id}" data-k="${D.k}">${v}</span>` : ""}</td>`;
      });
      h += `<td class="tot" rowspan="2">__TOT__</td></tr><tr class="otr">${rowOt}</tr>`;
      if (pN) ppl++;
      gH += pH; gN += pN;
      h = h.replace("__TOT__", `${pH}h<small>${pN} ${pN === 1 ? X.day : X.days}</small>`);
    }
    const gSum = gt.reduce((a, b) => a + b.h, 0), ov = gt.filter(t => t.n > 1).length;
    h += `<tr class="gsum"><th class="nm">${X.gtot}</th>`;
    days.forEach((D, i) => h += `<td class="${cls(D)}${gt[i].n > 1 ? " ov" : ""}"${gt[i].n > 1 ? ` title="${X.ovTip(gt[i].n)}"` : ""}>${gt[i].n ? gt[i].n + "p" : ""}</td>`);
    h += `<td class="tot">${gSum}h${ov ? `<small class="ovc">${X.ovN(ov)}</small>` : ""}</td></tr>`;
  }
  h += `</tbody><tfoot><tr><td class="nm">${X.dtot}</td>`;
  days.forEach((D, i) => h += `<td class="${cls(D)}">${dayTot[i].h || ""}<small>${dayTot[i].n ? dayTot[i].n + "p" : ""}</small></td>`);
  h += `<td class="tot">${gH}h</td></tr></tfoot>`;
  $("grid").innerHTML = h;
  $("sHrs").textContent = gH; $("sCnt").textContent = gN; $("sPpl").textContent = `${ppl} / ${shown}`;
  $("gview").innerHTML = [["all", X.all], ...S.groups.map(G => [G.id, G.name])].map(([v, t]) => `<option value="${v}"${v === S.view ? " selected" : ""}>${esc(t)}</option>`).join("");
  // holiday list
  const list = days.filter(D => D.hol);
  $("hlist").innerHTML = list.length ? list.map(D => `<li><span class="dt">${D.d} ${X.MN[m].slice(0, 3)} (${X.WD[D.w]})</span><span>${esc(D.hol)}</span>${D.w === 0 ? `<span class="tag">${X.sun}</span>` : D.w === 6 ? `<span class="tag">${X.sat}</span>` : ""}</li>`).join("") : `<li style="color:var(--mute)">${X.noHol}</li>`;
  $("hol").value = holText();
}
function short(n) { return n.replace(/'s Birthday/i, "").replace(/\(.*?\)/g, "").split(/\s+/).filter(w => w && !/^(of|the|day)$/i.test(w)).slice(0, 2).join(" "); }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }
function toast(t) { const e = $("toast"); e.textContent = t; e.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove("on"), 1800); }

// ---------- drag & drop (mouse, touch, pen) ----------
let drag = null, pasteVal = 0;
document.addEventListener("pointerdown", e => {
  const c = e.target.closest(".chip");
  if (!c || c.classList.contains("pk")) return;
  e.preventDefault();
  drag = {src: c, x0: e.clientX, y0: e.clientY, moved: false, val: c.dataset.new ? +c.dataset.new : S.ot[`${c.dataset.p}|${c.dataset.k}`], from: c.dataset.new ? null : {p: c.dataset.p, k: c.dataset.k}, ghost: null, tgt: null};
});
document.addEventListener("pointermove", e => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;
  if (!drag.moved) { drag.moved = true; closePop(); const g = drag.src.cloneNode(true); g.textContent = drag.val + "h"; g.classList.add("ghost"); document.body.append(g); drag.ghost = g; if (drag.from) drag.src.style.opacity = .3; }
  drag.ghost.style.left = e.clientX + "px"; drag.ghost.style.top = e.clientY + "px";
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const cell = el && el.closest("td.cell"), tr = el && el.closest("#trash");
  if (drag.tgt && drag.tgt !== cell) drag.tgt.classList.remove("tgt");
  drag.tgt = cell; if (cell) cell.classList.add("tgt");
  $("trash").classList.toggle("hot", !!tr); drag.trash = !!tr;
  autoScroll(e);
});
document.addEventListener("pointerup", e => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.ghost) d.ghost.remove();
  $("trash").classList.remove("hot");
  if (d.tgt) d.tgt.classList.remove("tgt");
  if (!d.moved) { if (d.from) openPop(d.from, d.src); return; }
  if (d.trash && d.from) { delete S.ot[`${d.from.p}|${d.from.k}`]; toast(X.tDel); }
  else if (d.tgt) {
    const to = `${d.tgt.dataset.p}|${d.tgt.dataset.k}`;
    if (d.from) {
      const fr = `${d.from.p}|${d.from.k}`;
      if (fr !== to) { const old = S.ot[to]; S.ot[to] = d.val; if (old) S.ot[fr] = old; else delete S.ot[fr]; }
    } else S.ot[to] = d.val;
  }
  save(); render();
});
function autoScroll(e) {
  const w = $("wrap"), r = w.getBoundingClientRect(), m = 40;
  if (e.clientX > r.right - m) w.scrollLeft += 14; else if (e.clientX < r.left + 150 + m && e.clientX > r.left) w.scrollLeft -= 14;
  if (e.clientY > r.bottom - m) w.scrollTop += 14; else if (e.clientY < r.top + m && e.clientY > r.top) w.scrollTop -= 14;
}

// ---------- popover: edit hours, copy, delete ----------
let popAt = null, popMode = "edit";
function openPop(at, el, mode) {
  popAt = at; popMode = mode || "edit"; $("pNew").style.display = popMode === "new" ? "flex" : "none"; $("pEdit").style.display = popMode === "new" ? "none" : "flex"; const r = el.getBoundingClientRect(), p = $("pop");
  if (popMode === "edit") $("pVal").textContent = S.ot[`${at.p}|${at.k}`] + "h";
  p.classList.add("on");
  const pw = p.offsetWidth;
  p.style.left = Math.max(8, Math.min(innerWidth - pw - 8, r.left + r.width / 2 - pw / 2)) + "px";
  p.style.top = (r.bottom + 8 + 60 > innerHeight ? r.top - 60 : r.bottom + 8) + "px";
}
function closePop() { $("pop").classList.remove("on"); popAt = null; }
function bump(n) { const k = `${popAt.p}|${popAt.k}`; S.ot[k] = Math.max(1, Math.min(16, S.ot[k] + n)); $("pVal").textContent = S.ot[k] + "h"; save(); const at = popAt; render(); popAt = at; }
$("pMinus").onclick = () => bump(-1);
$("pPlus").onclick = () => bump(1);
$("pDel").onclick = () => { delete S.ot[`${popAt.p}|${popAt.k}`]; save(); closePop(); render(); toast(X.tDel); };
$("pClose").onclick = closePop;
$("pCopy").onclick = () => { pasteVal = S.ot[`${popAt.p}|${popAt.k}`]; closePop(); document.body.classList.add("pasting"); document.querySelectorAll("td.cell").forEach(c => c.classList.add("paste")); toast(X.tCopy(pasteVal)); };
document.addEventListener("click", e => {
  if (pasteVal) {
    const c = e.target.closest("td.cell");
    if (c && !c.querySelector(".chip")) { S.ot[`${c.dataset.p}|${c.dataset.k}`] = pasteVal; save(); render(); document.querySelectorAll("td.cell").forEach(x => x.classList.add("paste")); return; }
    if (!c) { pasteVal = 0; document.querySelectorAll("td.cell").forEach(x => x.classList.remove("paste")); }
  }
  if (popAt && !e.target.closest(".pop") && !e.target.closest(".chip") && !e.target.closest("td.cell")) closePop();
  const c = e.target.closest("td.cell");
  if (c && !pasteVal && !c.querySelector(".chip")) openPop({p: c.dataset.p, k: c.dataset.k}, c, "new");
});
document.addEventListener("click", e => {
  const b = e.target.closest(".pk"); if (b && popAt) { S.ot[`${popAt.p}|${popAt.k}`] = +b.dataset.h; save(); closePop(); render(); return; }
  if (e.target.closest("[data-pclose]")) closePop();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { closePop(); pasteVal = 0; document.querySelectorAll("td.cell").forEach(x => x.classList.remove("paste")); } });

// ---------- staff ----------
document.addEventListener("input", e => { const n = e.target.closest(".pn"); if (n) { const P = S.people.find(p => p.id === n.dataset.p); if (P) { P.name = n.textContent.trim() || P.name; save(); } } });
document.addEventListener("keydown", e => { if (e.target.closest && e.target.closest(".pn") && e.key === "Enter") { e.preventDefault(); e.target.blur(); } });
document.addEventListener("click", e => {
  const x = e.target.closest("[data-del]"); if (!x) return;
  const id = x.dataset.del, P = S.people.find(p => p.id === id);
  if (x.dataset.arm) { S.people = S.people.filter(p => p.id !== id); for (const k of Object.keys(S.ot)) if (k.startsWith(id + "|")) delete S.ot[k]; save(); render(); toast(X.tRm(P.name)); }
  else { x.dataset.arm = 1; x.textContent = X.rmQ; x.style.color = "var(--bad)"; x.style.fontSize = "12px"; setTimeout(() => { if (x.isConnected) { delete x.dataset.arm; x.textContent = "×"; x.style.color = ""; x.style.fontSize = ""; } }, 3000); }
});
document.addEventListener("click", e => {
  const a = e.target.closest("[data-add]"); if (!a) return;
  const n = S.people.length, id = "p" + Date.now().toString(36);
  S.people.push({id, name: X.person + " " + (n < 26 ? String.fromCharCode(65 + n) : n + 1), g: a.dataset.add}); save(); render();
});
$("gview").addEventListener("change", e => { S.view = e.target.value; save(); render(); });
$("gNew").onclick = () => { $("gForm").hidden = false; $("gName").value = ""; $("gName").focus(); };
$("gCancel").onclick = () => { $("gForm").hidden = true; };
$("gForm").onsubmit = e => {
  e.preventDefault(); const n = $("gName").value.trim(); if (!n) return;
  const id = "g" + Date.now().toString(36); S.groups.push({id, name: n}); S.view = id; save(); $("gForm").hidden = true; render(); toast(X.gMade(n));
};
document.addEventListener("click", e => {
  const x = e.target.closest("[data-gdel]"); if (!x) return;
  const id = x.dataset.gdel, G = S.groups.find(g => g.id === id);
  if (!x.dataset.arm) { x.dataset.arm = 1; x.textContent = X.rmQ; x.style.color = "var(--bad)"; x.style.fontSize = "11px"; setTimeout(() => { if (x.isConnected) { delete x.dataset.arm; x.textContent = "×"; x.style.color = ""; x.style.fontSize = ""; } }, 3000); return; }
  const ids = S.people.filter(p => p.g === id).map(p => p.id);
  S.people = S.people.filter(p => p.g !== id); S.groups = S.groups.filter(g => g.id !== id);
  for (const k of Object.keys(S.ot)) if (ids.includes(k.split("|")[0])) delete S.ot[k];
  if (S.view === id) S.view = "all"; save(); render(); toast(X.tRm(G.name));
});
// work status: tap to cycle W -> OFF -> REST
document.addEventListener("click", e => {
  const c = e.target.closest("td.wsc"); if (!c) return;
  const [pid, k] = c.dataset.ws.split("|"); const P = S.people.find(p => p.id === pid);
  const D = {k, w: new Date(k + "T12:00").getDay()};
  const nx = WS_NEXT[wsOf(P, D)], def = D.w === 0 ? "R" : D.w === 6 ? "O" : "W";
  if (nx === def) delete S.ws[c.dataset.ws]; else S.ws[c.dataset.ws] = nx;
  save(); render();
});

// ---------- month & toolbar ----------
$("prev").onclick = () => { S.m--; if (S.m < 0) { S.m = 11; S.y--; } save(); render(); };
$("next").onclick = () => { S.m++; if (S.m > 11) { S.m = 0; S.y++; } save(); render(); };
$("sample").onclick = () => { S = sample(); save(); render(); toast(X.tSample); };
let clrArm = 0;
$("clear").onclick = () => {
  if (!clrArm) { clrArm = 1; $("clear").textContent = X.clearQ; $("clear").classList.add("arm"); setTimeout(() => { clrArm = 0; $("clear").textContent = X.clear; $("clear").classList.remove("arm"); }, 3000); return; }
  const pre = `${S.y}-${pad(S.m + 1)}-`;
  for (const k of Object.keys(S.ot)) if (k.split("|")[1].startsWith(pre)) delete S.ot[k];
  clrArm = 0; $("clear").textContent = X.clear; $("clear").classList.remove("arm"); save(); render(); toast(X.tClr);
};
$("holSave").onclick = () => { try { localStorage.setItem("kk-hol", $("hol").value); } catch (e) {} render(); toast(X.tHol); };

load(); applyT(); render();
</script>
</body>
