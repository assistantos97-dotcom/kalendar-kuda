<!DOCTYPE html>

<meta charset="utf-8">

<link rel="stylesheet" href="hub.css">
<style>
input[type=number]{width:96px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none;border-radius:8px}
.tabs button.on{background:var(--pri);color:var(--priInk);border-color:var(--pri)}
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.sc{border-radius:var(--r);border:1px solid var(--line);padding:18px 20px 18px 24px;background:var(--card);box-shadow:var(--sh);position:relative;overflow:hidden}
.sc::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--blue)}
.sc h3{margin:0 0 10px;font-size:14px;color:var(--mute);font-weight:700}
.sc .big{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sc .big div{display:grid}
.sc .lab{font-size:13px;color:var(--mute);font-weight:600}
.sc .v{font-size:clamp(28px,4.4vw,40px);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.1}
.sc .v.p{color:var(--pri)}
.chip{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:5px 12px;border-radius:999px;font-weight:800;font-size:14px;white-space:nowrap}
.chip.pos{background:#05966918;color:var(--ok)}.chip.neg{background:#dc262614;color:var(--bad)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;border-radius:4px;background:var(--blue)}
.ledger{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:15px}
th{background:var(--soft);color:var(--mute);font-weight:700;font-size:13px;padding:12px 10px;text-align:left;border-bottom:1px solid var(--line)}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line)}
tr.we td{background:var(--we)}tr.off td{background:var(--off)}tr.ph td{background:var(--ph)}
td input[type=number]{width:84px;min-height:38px;text-align:right;padding:6px 10px;background:var(--card)}
td select{min-height:36px;padding:4px 10px;border-radius:999px;font-size:14px;font-weight:600;background:var(--card)}
tr.off td select{border-color:var(--pri);color:var(--pri)}tr.ph td select{border-color:#fcd34d;color:#92400e}
:root[data-theme=dark] tr.off td select{color:#c7d2fe}:root[data-theme=dark] tr.ph td select{color:#fde68a}
td.d.pos{color:var(--ok);font-weight:800}td.d.neg{color:var(--bad);font-weight:800}
tfoot td{font-weight:700;background:var(--soft);color:var(--ink);border-top:2px solid var(--line);padding:12px 10px}
tfoot td.n{color:var(--pri)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--mute);padding:12px 16px}
.legend span{display:inline-flex;gap:6px;align-items:center}.legend i{width:14px;height:14px;border-radius:4px;display:inline-block;border:1px solid var(--line)}
.rates{font-size:14px;min-width:0}.rates td{padding:6px 10px}
.ds{display:none}
@media(max-width:600px){table{font-size:13px;min-width:0}td,th{padding:6px 4px}td input[type=number]{width:56px;padding:6px}td select{width:76px;font-size:12px;padding:4px 6px}.hm{display:none}.dl{display:none}.ds{display:inline}th{font-size:12px}.nav a{padding:8px 12px;font-size:13px}}
@media print{.card.in,#tabs{display:none}body{background:#fff}}
</style>
</head>
<body data-page="plan" data-help="guide.html#plan">
<header id="hub"></header><script src="hub.js"></script>
<main>
  <section class="card in">
    <h2 data-i="h1"></h2>
    <textarea id="src" spellcheck="false" data-ph="ph"></textarea>
    <p class="hint" data-i="hint1"></p>
    <div class="row">
      <label class="f"><span data-i="from"></span><input type="date" id="from"></label>
      <label class="f"><span data-i="to"></span><input type="date" id="to"></label>
      <button id="go" data-i="go"></button>
      <button class="warn" id="reset" data-i="reset"></button>
    </div>
  </section>

  <section class="card in">
    <details>
      <summary data-i="h2"></summary>
      <div class="row">
        <label class="f"><span data-i="sEnd"></span><input type="time" id="sEnd" value="17:00"></label>

      </div>

      <label class="f" style="margin-top:10px"><span data-i="hol"></span>
        <textarea id="hol" style="min-height:80px">2026-12-11 Sultan's Birthday
2026-12-25 Christmas</textarea></label>
      <h3 style="margin:14px 0 6px;font-size:15px" data-i="rt"></h3>
      <div class="scroll"><table class="rates" style="min-width:0"><tbody id="rates"></tbody></table></div>

  <p id="msg" aria-live="polite"></p>
  <div class="tabs" id="tabs"></div>
  <section id="out" style="display:grid;gap:14px"></section>
</main>

<script>
{
const $ = id => document.getElementById(id);
const T = {
 ms:{title:'OT <b>Plan vs Actual</b>',sub:'Paste jadual dari Excel → jam & RM plan dikira sendiri → isi jam actual → banding.',cal:'Kalendar Kuda',

 en:{title:'OT <b>Plan vs Actual</b>',sub:'Paste the roster from Excel → plan hours & RM are calculated → key in actual hours → compare.',cal:'Horse Calendar',
  h1:'1. Paste Excel roster & set the cut-off',ph:'Copy the Fieldname / Shiftcode / WorkStatus / OT rows from Excel, paste here',

};
let LANG='ms'; try{LANG=new URLSearchParams(location.search).get('lang')||localStorage.getItem('kk-lang')||'en'}catch(e){} if(!T[LANG])LANG='en';
let L=T[LANG];

// ---------- pay rules (Revised OT allowance MJG9–MJG14) ----------
function pay(type, hrs) {
  const h = Math.floor(+hrs || 0);
  if (h < 1) return 0;
  if (type === 'P') return h <= 7 ? 20 * h : 25 * h;
  if (type === 'O') { if (h <= 7) return 10 * h; if (h <= 10) return 12.5 * h; return 200 + 30 * (h - 11); }
  return h <= 2 ? 10 * h : 20 + 30 * (h - 2);
}

// ---------- roster parser (same as Kalendar Kuda) ----------
function parse(text) {
  const blocks = [];
  for (const raw of text.split(/\r?\n/)) {
    if (!raw.trim()) continue;
    let c = (raw.includes("\t") ? raw.split("\t") : raw.trim().split(/\s{2,}/)).map(v => (v || "").trim());
    const KEYS = ["fieldname", "shiftcode", "workstatus", "ot"], norm = v => (v || "").toLowerCase().replace(/\s+/g, "");
    const ki = c.findIndex((v, i) => i < 8 && KEYS.includes(norm(v)));
    if (ki < 0) continue;
    c = c.slice(ki); const key = norm(c[0]);
    if (key === "fieldname") {
      const dates = {}; let nameCol = -1;
      c.forEach((v, i) => { const m = v.match(/(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) dates[i] = iso(+m[1], +m[2] - 1, +m[3]); else if (/^name$/i.test(v) && nameCol < 0) nameCol = i; });
      if (Object.keys(dates).length) blocks.push({c, dates, nameCol, rows: []});
      continue;
    }
    if (blocks.length && key !== "fieldname") blocks[blocks.length - 1].rows.push({key, c});
  }
  const people = {}, order = []; let lastName = "";
  for (const B of blocks) {
    const idx = Object.keys(B.dates).map(Number), d0 = Math.min(...idx);
    const ws = B.rows.find(r => r.key === "workstatus");
    const lenOff = B.rows.length ? Math.max(0, B.rows[0].c.length - B.c.length) : 0;
    let off = lenOff;
    if (ws) { let best = -1; for (let o = 0; o <= 6; o++) { let sc = 0; for (const i of idx) if (/^[A-Za-z]{1,3}$/.test(ws.c[i + o] || "")) sc++; if (sc > best || (sc === best && o === lenOff)) { best = sc; off = o; } } }
    const nameOf = c => { if (B.nameCol >= 0) { const v = c[B.nameCol + off] || ""; if (v && !/^\d+$/.test(v)) return v; } for (let i = 1; i < d0 + off; i++) { const v = c[i] || ""; if (v && !/^[\d.]+$/.test(v)) return v; } return ""; };
    let bName = ""; for (const R of B.rows) { const n = nameOf(R.c); if (n) { bName = n; break; } }
    for (const R of B.rows) {
      const nm = nameOf(R.c) || bName || lastName; if (!nm) continue; lastName = nm;
      if (!people[nm]) { people[nm] = {name: nm, days: {}}; order.push(nm); }
      for (const [i, k] of Object.entries(B.dates)) {
        const v = R.c[+i + off] || ""; const D = people[nm].days[k] || (people[nm].days[k] = {ws: "", shift: "", ot: ""});
        if (R.key === "workstatus") D.ws = v.toUpperCase(); else if (R.key === "shiftcode") D.shift = v.toUpperCase();
        else D.ot = /^\d{1,2}[:.]\d{2}$/.test(v) ? v.replace(".", ":").padStart(5, "0") : "";
      }
    }
  }
  return order.map(n => people[n]);
}
function iso(y, m, d) { return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`; }
const mins = t => { const [h, m] = (t || '0:0').split(':').map(Number); return h * 60 + m; };
const isOff = (D, k) => (D && (D.ws === 'O' || D.ws === 'R' || D.shift === 'OFF' || D.shift === 'REST')) || ((!D || (!D.ws && !D.shift)) && k && [0, 6].includes(new Date(k + 'T12:00').getDay()));
function planHours(D, k) {
  if (!D || !D.ot) return 0;
  const end = mins(D.ot);
  let h = isOff(D, k) ? (end - mins($('oStart').value)) / 60 - (+$('brk').value || 0) : (end - mins($('sEnd').value)) / 60;
  return Math.max(0, Math.round(h * 100) / 100);
}
function holidays() { const h = {}; for (const l of $('hol').value.split(/\r?\n/)) { const m = l.match(/(\d{4})-(\d{1,2})-(\d{1,2})\s*(.*)/); if (m) h[iso(+m[1], +m[2] - 1, +m[3])] = m[4].trim(); } return h; }

// ---------- storage (per viewer browser) ----------
const S = { get(k, d) { try { const v = localStorage.getItem('ot:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
            set(k, v) { try { localStorage.setItem('ot:' + k, JSON.stringify(v)); } catch (e) {} } };

const fmtRM = v => 'RM' + (Math.round(v * 100) / 100).toLocaleString('en-MY', {minimumFractionDigits: 0, maximumFractionDigits: 2});
const fmtH = v => (Math.round(v * 100) / 100).toString();
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
let PEOPLE = [], CUR = 0;

function dateList() {
  const a = $('from').value, b = $('to').value; if (!a || !b) return [];
  const out = []; let d = new Date(a + 'T12:00'); const e = new Date(b + 'T12:00');
  while (d <= e && out.length < 62) { out.push(iso(d.getFullYear(), d.getMonth(), d.getDate())); d.setDate(d.getDate() + 1); }
  return out;
}
function calc(P) {
  const hol = holidays(), rows = [];
  for (const k of dateList()) {
    const D = P.days[k], dow = new Date(k + 'T12:00').getDay();
    const autoType = hol[k] !== undefined ? 'P' : isOff(D, k) ? 'O' : 'N';
    const type = S.get(`type:${P.name}:${k}`, autoType);
    const ph = planHours(D, k);
    const a = S.get(`act:${P.name}:${k}`, '');
    rows.push({k, dow, D, type, autoType, ph, pp: pay(type, ph), a, ap: a === '' ? 0 : pay(type, a), hol: hol[k]});
  }
  return rows;
}
function render() {
  const out = $('out'); out.textContent = '';
  if (!PEOPLE.length) return;
  const P = PEOPLE[CUR], rows = calc(P);
  const sum = (f) => rows.reduce((s, r) => s + f(r), 0);
  const tp = sum(r => r.ph), ta = sum(r => +r.a || 0), tpp = sum(r => r.pp), tap = sum(r => r.ap);
  const dH = ta - tp, dR = tap - tpp;
  const sign = v => (v > 0 ? '+' : '') ;
  const score = document.createElement('div'); score.className = 'score';
  score.innerHTML = `
   <div class="sc"><h3>${L.hrs}</h3><div class="big"><div><span class="lab">Plan</span><span class="v p">${fmtH(tp)}</span></div><div><span class="lab">Actual</span><span class="v">${fmtH(ta)}</span></div></div>
     <span class="chip ${dH >= 0 ? 'pos' : 'neg'}">${L.vs}: ${sign(dH)}${fmtH(dH)} h</span><div class="bar"><i style="width:${Math.min(100, tp ? ta / tp * 100 : 0)}%"></i></div></div>
   <div class="sc"><h3>${L.rm}</h3><div class="big"><div><span class="lab">Plan</span><span class="v p">${fmtRM(tpp)}</span></div><div><span class="lab">Actual</span><span class="v">${fmtRM(tap)}</span></div></div>
     <span class="chip ${dR >= 0 ? 'pos' : 'neg'}">${L.vs}: ${dR >= 0 ? '+' : '−'}${fmtRM(Math.abs(dR))}</span><div class="bar"><i style="width:${Math.min(100, tpp ? tap / tpp * 100 : 0)}%"></i></div></div>`;
  out.append(score);

  const led = document.createElement('div'); led.className = 'ledger'; const wrap = document.createElement('div'); wrap.className = 'scroll'; led.append(wrap);
  const opt = (v, cur) => `<option value="${v}" ${v === cur ? 'selected' : ''}>${L[v]}</option>`;
  wrap.innerHTML = `<table><thead><tr><th>${L.day}</th><th>${L.date}</th><th>${L.type}</th><th class="n">${L.plan}</th><th class="n hm">${L.planrm}</th><th class="n">${L.act}</th><th class="n">${L.actrm}</th><th class="n hm">${L.diff}</th></tr></thead><tbody>${
    rows.map(r => { const cls = r.type === 'P' ? 'ph' : r.type === 'O' ? 'off' : (r.dow === 0 || r.dow === 6 ? 'we' : ''); const df = r.ap - r.pp;
      return `<tr class="${cls}"><td><span class="dl">${L.days[r.dow]}${r.hol ? ' · ' + esc(r.hol) : ''}</span><span class="ds">${L.days[r.dow].slice(0,3)}</span></td><td class="n">${r.k.slice(8)}/${r.k.slice(5, 7)}</td>
      <td><select data-t="${r.k}">${opt('N', r.type)}${opt('O', r.type)}${opt('P', r.type)}</select></td>
      <td class="n">${r.ph ? fmtH(r.ph) + (r.D && r.D.ot ? ` <small style="color:var(--mute)">(${r.D.ot})</small>` : '') : ''}</td><td class="n hm">${r.pp ? fmtRM(r.pp) : ''}</td>
      <td class="n"><input type="number" inputmode="decimal" min="0" step="0.5" data-a="${r.k}" value="${esc(r.a)}" aria-label="Actual ${r.k}"></td>
      <td class="n">${r.a !== '' ? fmtRM(r.ap) : ''}</td><td class="n hm ${df >= 0 ? 'pos' : 'neg'} d">${r.a !== '' || r.pp ? (df >= 0 ? '+' : '−') + fmtRM(Math.abs(df)) : ''}</td></tr>`; }).join('')
  }</tbody><tfoot><tr><td colspan="3">${L.total}</td><td class="n">${fmtH(tp)}</td><td class="n hm">${fmtRM(tpp)}</td><td class="n">${fmtH(ta)}</td><td class="n">${fmtRM(tap)}</td><td class="n hm">${dR >= 0 ? '+' : '−'}${fmtRM(Math.abs(dR))}</td></tr></tfoot></table>`;
  out.append(led);
  const lg = document.createElement('div'); lg.className = 'legend';
  lg.innerHTML = [['var(--we)', L.legend[0]], ['var(--off)', L.legend[1]], ['var(--ph)', L.legend[2]]].map(([c, t]) => `<span><i style="background:${c}"></i>${t}</span>`).join('');
  led.append(lg);

  wrap.querySelectorAll('[data-a]').forEach(inp => inp.onchange = () => { S.set(`act:${P.name}:${inp.dataset.a}`, inp.value === '' ? '' : +inp.value); const y = scrollY; render(); scrollTo(0, y); });
  wrap.querySelectorAll('[data-t]').forEach(sel => sel.onchange = () => { S.set(`type:${P.name}:${sel.dataset.t}`, sel.value); const y = scrollY; render(); scrollTo(0, y); });
}
function tabs() {
  const t = $('tabs'); t.innerHTML = PEOPLE.length > 1 ? PEOPLE.map((p, i) => `<button class="${i === CUR ? 'on' : ''}" data-i2="${i}">${esc(p.name)}</button>`).join('') : '';
  t.querySelectorAll('button').forEach(b => b.onclick = () => { CUR = +b.dataset.i2; tabs(); render(); });
}
function run() {
  const msg = $('msg'); msg.className = ''; msg.textContent = '';
  ['src', 'from', 'to', 'sEnd', 'oStart', 'brk', 'hol'].forEach(id => S.set('f:' + id, $(id).value));
  PEOPLE = parse($('src').value).filter(p => Object.keys(p.days).length);
  if (!PEOPLE.length) { msg.className = 'err'; msg.textContent = L.nodata; $('out').textContent = ''; $('tabs').textContent = ''; return; }
  if (!$('from').value || !$('to').value) {
    const all = PEOPLE.flatMap(p => Object.keys(p.days)).sort();
    if (!$('from').value) $('from').value = all[0]; if (!$('to').value) $('to').value = all[all.length - 1];
  }
  if (CUR >= PEOPLE.length) CUR = 0;
  msg.textContent = L.done(PEOPLE.length, PEOPLE.map(p => p.name).join(', '));
  tabs(); render();
}
function applyLang() {
  L = T[LANG]; document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i]').forEach(e => e.innerHTML = L[e.dataset.i]);
  document.querySelectorAll('[data-ph]').forEach(e => e.placeholder = L[e.dataset.ph]);
  document.querySelectorAll('[data-l]').forEach(b => b.classList.toggle('on', b.dataset.l === LANG));
  $('rates').innerHTML = L.r.map(r => `<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('');
  if (PEOPLE.length) run();
}
document.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { LANG = b.dataset.l; try { localStorage.setItem('kk-lang', LANG); } catch (e) {} applyLang(); });
['src', 'from', 'to', 'sEnd', 'oStart', 'brk', 'hol'].forEach(id => { const v = S.get('f:' + id, null); if (v !== null) $(id).value = v; });
$('go').onclick = run;
let armT = null;
$('reset').onclick = () => {
  const b = $('reset');
  if (!b.classList.contains('arm')) { b.classList.add('arm'); b.textContent = L.resetQ; clearTimeout(armT); armT = setTimeout(() => { b.classList.remove('arm'); b.textContent = L.reset; }, 4000); return; }
  clearTimeout(armT); b.classList.remove('arm'); b.textContent = L.reset;
  try { Object.keys(localStorage).filter(k => k.startsWith('ot:')).forEach(k => localStorage.removeItem(k)); } catch (e) {}
  $('src').value = ''; $('from').value = ''; $('to').value = '';
  PEOPLE = []; CUR = 0; $('out').textContent = ''; $('tabs').textContent = '';
  const m = $('msg'); m.className = ''; m.textContent = L.resetDone;
};
['from', 'to', 'sEnd', 'oStart', 'brk', 'hol'].forEach(id => $(id).addEventListener('change', () => { if (PEOPLE.length) run(); }));
applyLang();
if ($('src').value.trim()) run();
}
</script>
