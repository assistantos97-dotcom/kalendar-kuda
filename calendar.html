<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horse Calendar · OT Hub</title>
<link rel="stylesheet" href="hub.css">
<style>
.out{display:grid;gap:16px}
.cal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.cal h3{margin:0 0 8px;font-size:15px}
.cal img{width:100%;max-width:900px;display:block;border-radius:6px;border:1px solid var(--line)}
.cal .row{align-items:center}
.cal .hint{margin:0}
label{font-size:14px;display:flex;gap:8px;align-items:center}
input[type=number]{width:84px}
@media(min-width:1000px){.out{grid-template-columns:1fr 1fr}}
</style>
</head>
<body data-page="calendar" data-help="guide.html#calendar">
<header id="hub"></header><script src="hub.js"></script>
<main>
  <section class="card">
    <h2 data-i="h1"></h2>
    <textarea id="src" spellcheck="false" data-ph="ph"></textarea>
    <p class="hint" data-i="hint1"></p>
    <div class="row">
      <button id="go" data-i="go"></button>
      <button class="alt" id="sample" data-i="sample"></button>
      <button class="alt" id="clear" data-i="clear"></button>
      <button class="alt" id="send" data-i="send"></button>
    </div>
  </section>

  <section class="card">
    <details>
      <summary data-i="h2"></summary>
      <p class="hint" data-i="hint2"></p>
      <textarea id="hol" style="min-height:90px">2026-12-11 Sultan's Birthday
2026-12-25 Christmas</textarea>
      <p class="hint" data-i="hint3"></p>
      <div class="row">
        <label><span data-i="lw"></span> <input type="number" id="hW" step="0.5" value="3.5"></label>
        <label><span data-i="lo"></span> <input type="number" id="hO" step="0.5" value="9.5"></label>
      </div>
    </details>
  </section>

  <p id="msg" aria-live="polite"></p>
  <section class="out" id="out"></section>
</main>

<script src="imgs.js"></script>
<script src="app.js?v=6"></script>
</body>
</html>
