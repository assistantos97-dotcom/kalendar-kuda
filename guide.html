<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>User Guide · OT Hub</title>
<link rel="stylesheet" href="hub.css">
<style>
.doc{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.toc{position:sticky;top:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.toc p{margin:6px 8px 6px;font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.toc a{display:block;padding:7px 10px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:14px;font-weight:500;border-left:3px solid transparent}
.toc a:hover{background:var(--soft)}
.toc a.on{background:var(--priSoft);border-left-color:var(--pri);color:var(--pri);font-weight:600}
.sec{scroll-margin-top:14px}
.sec h2{font-size:20px;margin:0 0 4px;display:flex;align-items:center;gap:10px}
.sec h2 .tagp{font-size:11px;font-weight:700;padding:3px 8px;border-radius:4px;background:var(--priSoft);color:var(--pri);text-transform:uppercase;letter-spacing:.05em}
.sec .lead{color:var(--mute);margin:0 0 14px}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;gap:10px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--soft)}
ol.steps li::before{content:counter(s);width:30px;height:30px;border-radius:6px;background:var(--pri);color:var(--priInk);font-weight:700;display:grid;place-items:center}
ol.steps b{display:block;margin-bottom:2px}
ol.steps span{color:var(--mute);font-size:14px}
.note{margin-top:12px;padding:10px 14px;border-left:4px solid var(--accent);background:var(--soft);border-radius:0 8px 8px 0;font-size:14px}
.open{display:inline-flex;margin-top:14px;text-decoration:none;font-weight:600;font-size:14px;padding:9px 16px;border-radius:8px;background:var(--pri);color:var(--priInk)}
pre{font:12px/1.5 var(--mono);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow:auto;margin:10px 0 0}
@media(max-width:820px){.doc{grid-template-columns:minmax(0,1fr)}.toc{position:static}}
</style>
</head>
<body data-page="guide">
<header id="hub"></header><script src="hub.js"></script>
<main>
  <div class="doc">
    <nav class="toc" aria-label="Contents">
      <p data-g="contents"></p>
      <a href="#calendar" data-g="calName"></a>
      <a href="#plan" data-g="planName"></a>
      <a href="#data" data-g="dataName"></a>
    </nav>
    <div style="display:grid;gap:16px">
      <section class="card sec" id="calendar">
        <h2><span data-g="calName"></span><span class="tagp" data-g="tag1"></span></h2>
        <p class="lead" data-g="calLead"></p>
        <ol class="steps" id="calSteps"></ol>
        <p class="note" data-g="calNote"></p>
        <a class="open" href="calendar.html" data-g="calOpen"></a>
      </section>
      <section class="card sec" id="plan">
        <h2><span data-g="planName"></span><span class="tagp" data-g="tag2"></span></h2>
        <p class="lead" data-g="planLead"></p>
        <ol class="steps" id="planSteps"></ol>
        <p class="note" data-g="planNote"></p>
        <a class="open" href="ot.html" data-g="planOpen"></a>
      </section>
      <section class="card sec" id="data">
        <h2 data-g="dataName"></h2>
        <p class="lead" data-g="dataLead"></p>
        <pre>Fieldname   Name   2026-12-01  2026-12-02  ...  Total OT (Hrs)
Shiftcode   Ali    M001        M001        ...
WorkStatus  Ali    W           W           ...
OT          Ali    20:00                   ...  61</pre>
        <p class="note" data-g="dataNote"></p>
      </section>
    </div>
  </div>
</main>

const steps = a => a.map(([t, d]) => `<li><div><b>${t}</b><span>${d}</span></div></li>`).join("");
function paint() {
  const L = G[(window.HUB && HUB.lang) || "en"] || G.en;
  document.querySelectorAll("[data-g]").forEach(e => e.textContent = L[e.dataset.g]);
  document.getElementById("calSteps").innerHTML = steps(L.cal);
  document.getElementById("planSteps").innerHTML = steps(L.plan);
}
document.addEventListener("hub:lang", paint);
paint();
const links = [...document.querySelectorAll(".toc a")];
function mark() { const h = location.hash || "#calendar"; links.forEach(a => a.classList.toggle("on", a.getAttribute("href") === h)); }
addEventListener("hashchange", mark); mark();
}
</script>
</body>
</html>
